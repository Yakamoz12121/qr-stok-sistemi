<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üniforma QR Stok Yönetimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-gray-200 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto space-y-8">
        <header class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">Üniforma QR Stok Yönetimi</h1>
                <p class="text-slate-400 mt-1">Öğrenci & Mesleki Kıyafet Mağazası</p>
            </div>
            <span class="bg-slate-800 text-blue-400 px-4 py-1.5 rounded-full text-sm font-medium border border-blue-500/30">Canlı Sistem</span>
        </header>

        <section class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
            <h2 class="text-xl font-semibold text-white mb-6">Yeni Ürün & QR Kod Ekle</h2>

            <form id="productForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Ürün Adı</label>
                        <input type="text" id="p_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Kategori / Alan</label>
                        <select id="p_category" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                            <option value="Sağlık / Tıp / Hemşirelik">Sağlık / Tıp / Hemşirelik</option>
                            <option value="Aşçılık / Mutfak">Aşçılık / Mutfak</option>
                            <option value="Okul / Öğrenci">Okul / Öğrenci</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Beden / Ölçü</label>
                        <input type="text" id="p_size" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Fiyat (TL)</label>
                        <input type="number" id="p_price" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Stok Adedi</label>
                        <input type="number" id="p_stock" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Kumaş / Ürün Detayı</label>
                        <input type="text" id="p_detail" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 px-4 rounded-lg transition-colors">
                    Ürünü Kaydet ve QR Kodu Üret
                </button>
            </form>
        </section>

        <section class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
            <h2 class="text-xl font-semibold text-white mb-6">Mevcut Ürünler ve QR Kod Etiketleri</h2>
            <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-slate-500 col-span-full">Yükleniyor...</p>
            </div>
        </section>
    </div>

    <script>
        const hostUrl = 'https://eakdoichqpyrtftdprbj.supabase.co';
        const hostKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVha2RvaWNocXB5cnRmdGRwcmJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTE4OTksImV4cCI6MjEwNzA2Nzg5OX0.tSJF1WgEj2AqRgpGawmFNuurOcQ5-kS0lCtu3cpqOj4'; 
        
        const client = window.supabase.createClient(hostUrl, hostKey);

        async function fetchAll() {
            try {
                const { data, error } = await client.from('products').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                const list = document.getElementById('productList');
                list.innerHTML = '';

                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="text-slate-500 col-span-full">Henüz kayıtlı ürün yok.</p>';
                    return;
                }

                data.forEach(item => {
                    const box = document.createElement('div');
                    box.className = 'bg-slate-900 p-4 rounded-lg border border-slate-700 flex flex-col items-center text-center';
                    const codeId = `qr-${item.id}`;
                    
                    box.innerHTML = `
                        <div class="w-full text-left mb-4">
                            <h3 class="font-bold text-white text-lg">${item.name}</h3>
                            <p class="text-sm text-sky-400">${item.category}</p>
                            <div class="mt-2 text-sm text-slate-400 space-y-1">
                                <p>Beden: <span class="text-white">${item.size}</span></p>
                                <p>Stok: <span class="text-white">${item.stock} adet</span></p>
                                <p>Fiyat: <span class="text-white">${item.price} ₺</span></p>
                                <p class="text-xs text-slate-400 mt-1">Detay: ${item.detail}</p>
                            </div>
                        </div>
                        <div class="bg-white p-2 rounded-lg mb-2 inline-block">
                            <div id="${codeId}"></div>
                        </div>
                        <span class="text-xs text-slate-500">ID: ${item.id}</span>
                    `;
                    list.appendChild(box);

                    new QRCode(document.getElementById(codeId), {
                        text: JSON.stringify({ id: item.id, name: item.name, size: item.size }),
                        width: 128,
                        height: 128
                    });
                });
            } catch (err) {
                console.error("Listeleme Hatası:", err);
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Kaydediliyor...';
            submitBtn.disabled = true;

            const payload = {
                name: document.getElementById('p_name').value,
                category: document.getElementById('p_category').value,
                size: document.getElementById('p_size').value,
                price: parseFloat(document.getElementById('p_price').value),
                stock: parseInt(document.getElementById('p_stock').value),
                detail: document.getElementById('p_detail').value
            };

            const { error } = await client.from('products').insert([payload]);
            
            submitBtn.textContent = 'Ürünü Kaydet ve QR Kodu Üret';
            submitBtn.disabled = false;

            if (error) {
                alert('Kayıt Hatası: ' + error.message);
            } else {
                alert('Ürün başarıyla kaydedildi!');
                document.getElementById('productForm').reset();
                fetchAll();
            }
        });

        window.onload = fetchAll;
    </script>
</body>
</html>
