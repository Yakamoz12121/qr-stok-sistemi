<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üniforma QR Stok Yönetimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-gray-200 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto space-y-8">
        <header class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">Üniforma QR Stok Yönetimi</h1>
                <p class="text-slate-400 mt-1">Öğrenci & Mesleki Kıyafet Mağazası</p>
            </div>
            <span class="bg-slate-800 text-blue-400 px-4 py-1.5 rounded-full text-sm font-medium border border-blue-500/30">Canlı Sistem</span>
        </header>

        <section class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
            <h2 class="text-xl font-semibold text-white mb-6">Yeni Ürün & QR Kod Ekle</h2>

            <form id="productForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Ürün Adı</label>
                        <input type="text" id="p_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Kategori Adı</label>
                        <input type="text" id="p_category" required placeholder="Örn: Kıyafetler, Aksesuarlar..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Beden / Ölçü</label>
                        <input type="text" id="p_size" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Fiyat (TL)</label>
                        <input type="number" id="p_price" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Stok Adedi</label>
                        <input type="number" id="p_stock" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Kumaş / Ürün Detayı</label>
                        <input type="text" id="p_detail" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 px-4 rounded-lg transition-colors">
                    Ürünü Kaydet ve QR Kodu Üret
                </button>
            </form>
        </section>

        <section class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-xl font-semibold text-white">Mevcut Ürünler ve Kategoriler</h2>
                <!-- Arama Çubuğu -->
                <div class="w-full md:w-72">
                    <input type="text" id="searchInput" placeholder="Ürün adıyla ara..." oninput="renderProducts()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>
            
            <!-- Kategori Filtre Butonları -->
            <div id="categoryTabs" class="flex flex-wrap gap-2 mb-6 border-b border-slate-700 pb-4"></div>

            <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-slate-500 col-span-full">Yükleniyor...</p>
            </div>
        </section>
    </div>

    <script>
        const hostUrl = 'https://eakdoichqpyrtftdprbj.supabase.co';
        const hostKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVha2RvaWNocXB5cnRmdGRwcmJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTE4OTksImV4cCI6MjEwNzA2Nzg5OX0.tSJF1WgEj2AqRgpGawmFNuurOcQ5-kS0lCtu3cpqOj4'; 
        
        const client = window.supabase.createClient(hostUrl, hostKey);
        let allProducts = [];
        let activeCategory = 'TÜMÜ';

        async function fetchAll() {
            try {
                const { data, error } = await client.from('products').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                allProducts = data || [];
                renderCategories();
                renderProducts();
            } catch (err) {
                console.error("Listeleme Hatası:", err);
            }
        }

        function renderCategories() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';

            const categories = ['TÜMÜ', ...new Set(allProducts.map(p => p.category ? p.category.trim() : 'Genel'))];

            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = activeCategory === cat;
                btn.className = `px-4 py-2 rounded-lg text-sm font-medium transition-colors border ${
                    isActive 
                        ? 'bg-sky-500 text-slate-950 border-sky-400 font-bold' 
                        : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'
                }`;
                btn.textContent = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderCategories();
                    renderProducts();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';

            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = activeCategory === 'TÜMÜ' 
                ? allProducts 
                : allProducts.filter(item => (item.category ? item.category.trim() : 'Genel') === activeCategory);

            if (searchQuery) {
                filtered = filtered.filter(item => item.name.toLowerCase().includes(searchQuery));
            }

            if (filtered.length === 0) {
                list.innerHTML = '<p class="text-slate-500 col-span-full">Aradığınız kriterlere uygun ürün bulunamadı.</p>';
                return;
            }

            filtered.forEach(item => {
                const box = document.createElement('div');
                
                // Stok 3 veya daha azsa kart kenarlığını kırmızı yapıp dikkat çekelim
                const isLowStock = item.stock <= 3;
                box.className = `bg-slate-900 p-4 rounded-lg border ${isLowStock ? 'border-rose-500/80 shadow-lg shadow-rose-950/30' : 'border-slate-700'} flex flex-col items-center text-center justify-between`;
                const codeId = `qr-${item.id}`;
                
                box.innerHTML = `
                    <div class="w-full text-left mb-3">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-white text-lg">${item.name}</h3>
                            ${isLowStock ? '<span class="bg-rose-500/20 text-rose-400 text-[10px] px-2 py-0.5 rounded border border-rose-500/30 font-bold animate-pulse">Kritik Stok!</span>' : ''}
                        </div>
                        <span class="inline-block bg-sky-950 text-sky-400 text-xs px-2.5 py-1 rounded-full border border-sky-800/50 mt-1">${item.category}</span>
                        <div class="mt-3 text-sm text-slate-400 space-y-1">
                            <p>Beden: <span class="text-white">${item.size}</span></p>
                            <p>Stok: <span class="text-white font-bold ${isLowStock ? 'text-rose-400' : ''}">${item.stock} adet</span></p>
                            <p>Fiyat: <span class="text-white">${item.price} ₺</span></p>
                            <p class="text-xs text-slate-400 mt-1">Detay: ${item.detail}</p>
                        </div>
                    </div>
                    <div class="bg-white p-2 rounded-lg mb-3 inline-block">
                        <div id="${codeId}"></div>
                    </div>
                    <div class="w-full space-y-2 mt-auto">
                        <div class="flex gap-2">
                            <button onclick="updateStock(${item.id}, ${item.stock} - 1)" class="flex-1 bg-red-600/30 hover:bg-red-600/50 text-red-300 text-xs py-1.5 rounded border border-red-500/30 font-medium">- Stok</button>
                            <button onclick="updateStock(${item.id}, ${item.stock} + 1)" class="flex-1 bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 text-xs py-1.5 rounded border border-emerald-500/30 font-medium">+ Stok</button>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="printQR('${item.name}', '${item.size}', '${codeId}')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-1.5 rounded border border-slate-600 font-medium">Yazdır / İndir</button>
                            <button onclick="deleteProduct(${item.id})" class="bg-rose-900/40 hover:bg-rose-900 text-rose-300 text-xs px-3 py-1.5 rounded border border-rose-700/50 font-medium">Sil</button>
                        </div>
                    </div>
                    <span class="text-[10px] text-slate-500 mt-2">ID: ${item.id}</span>
                `;
                list.appendChild(box);

                new QRCode(document.getElementById(codeId), {
                    text: JSON.stringify({ id: item.id, name: item.name, category: item.category, size: item.size, price: item.price }),
                    width: 110,
                    height: 110
                });
            });
        }

        async function updateStock(id, newStock) {
            if (newStock < 0) return;
            const { error } = await client.from('products').update({ stock: newStock }).eq('id', id);
            if (error) {
                alert('Stok güncellenemedi: ' + error.message);
            } else {
                fetchAll();
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
            const { error } = await client.from('products').delete().eq('id', id);
            if (error) {
                alert('Silme hatası: ' + error.message);
            } else {
                fetchAll();
            }
        }

        function printQR(name, size, codeId) {
            const qrElement = document.getElementById(codeId);
            const img = qrElement.querySelector('img') || qrElement.querySelector('canvas');
            if (!img) return;

            const win = window.open('', '_print');
            win.document.write(`
                <html>
                    <head><title>${name} - QR Etiket</title></head>
                    <body style="text-align:center; font-family:sans-serif; margin-top:50px;">
                        <h2>${name}</h2>
                        <p>Beden: ${size}</p>
                        <img src="${img.src || img.toDataURL()}" style="width:200px; height:200px; margin:20px auto; display:block;" />
                        <script>window.print(); window.close();<\/script>
                    </body>
                </html>
            `);
            win.document.close();
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Kaydediliyor...';
            submitBtn.disabled = true;

            const payload = {
                name: document.getElementById('p_name').value,
                category: document.getElementById('p_category').value.trim(),
                size: document.getElementById('p_size').value,
                price: parseFloat(document.getElementById('p_price').value),
                stock: parseInt(document.getElementById('p_stock').value),
                detail: document.getElementById('p_detail').value
            };

            const { error } = await client.from('products').insert([payload]);
            
            submitBtn.textContent = 'Ürünü Kaydet ve QR Kodu Üret';
            submitBtn.disabled = false;

            if (error) {
                alert('Kayıt Hatası: ' + error.message);
            } else {
                document.getElementById('productForm').reset();
                fetchAll();
            }
        });

        window.onload = fetchAll;
    </script>
</body>
</html>
